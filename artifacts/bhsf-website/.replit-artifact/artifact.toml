kind = "web"
previewPath = "/"
title = "Barangay Health Support Fund"
version = "1.0.0"
id = "artifacts/bhsf-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25196

[services.development]
run = "pnpm --filter @workspace/bhsf-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bhsf-website", "run", "build" ]
publicDir = "artifacts/bhsf-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25196"
BASE_PATH = "/"
